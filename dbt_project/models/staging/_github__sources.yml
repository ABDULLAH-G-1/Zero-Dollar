version: 2

sources:
  - name: github_raw
    schema: github_raw
    description: "Raw GitHub data ingested incrementally via dlt into DuckDB."
    tables:
      - name: raw_repos
        description: "Raw repository metadata table."
      - name: raw_commits
        description: "Raw commit history table."
      - name: raw_pull_requests
        description: "Raw pull requests table."
      - name: raw_issues
        description: "Raw issues table (pull requests filtered out)."
