name: Daily GitHub Analytics Pipeline

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC
  workflow_dispatch:      # Manual trigger from GitHub UI / API

jobs:
  pipeline:
    name: Ingestion, Transformation & Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dlt incremental ingestion to MotherDuck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          TARGET_ENV: prod
          LOOKBACK_DAYS: 90
        run: |
          python ingestion/github_pipeline.py

      - name: Run dbt models & tests on MotherDuck
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          cd dbt_project
          dbt build --target prod --profiles-dir .
